name: Alpha Release

on:
  push:
    branches:
      - alpha
      - alpha-releases
      - development
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Custom release name (optional)'
        required: false
        default: ''

jobs:
  alpha-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build shadow JAR
      run: ./gradlew clean shadowJar
      
    - name: Generate alpha release tag
      id: alpha_tag
      run: |
        if [ -n "${{ github.event.inputs.release_name }}" ]; then
          ALPHA_TAG="alpha-${{ github.event.inputs.release_name }}-$(date +%Y%m%d-%H%M%S)"
        else
          ALPHA_TAG="alpha-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}"
        fi
        echo "tag=$ALPHA_TAG" >> $GITHUB_OUTPUT
        echo "Generated tag: $ALPHA_TAG"
        
    - name: Create alpha release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.alpha_tag.outputs.tag }}
        name: "Alpha Build ${{ steps.alpha_tag.outputs.tag }}"
        body: |
          🚧 **Alpha/Development Build** 🚧
          
          This is an **alpha/development build** from commit `${{ github.sha }}`.
          
          **⚠️ Warning:** Alpha builds may contain bugs, incomplete features, or breaking changes. Use at your own risk!
          
          **Branch:** `${{ github.ref_name }}`
          **Commit:** ${{ github.sha }}
          **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          **Download the JAR file directly from the assets below.**
        files: build/libs/*.jar
        prerelease: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Comment on commit (if push event)
      if: github.event_name == 'push'
      uses: actions/github-script@v7
      with:
        script: |
          const tag = '${{ steps.alpha_tag.outputs.tag }}';
          const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;
          
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: `🚀 **Alpha release created!**\n\nDownload: [${tag}](${releaseUrl})`
          });