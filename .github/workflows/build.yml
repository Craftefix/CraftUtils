name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build shadow JAR
      run: ./gradlew shadowJar
      
    - name: Upload JAR to transfer.sh
      run: |
        echo "Uploading JAR to transfer.sh for direct download..."
        UPLOAD_URL=$(curl --upload-file build/libs/CraftUtils-1.0.0-all.jar https://transfer.sh/CraftUtils.jar)
        echo "Direct download URL: $UPLOAD_URL"
        echo "DOWNLOAD_URL=$UPLOAD_URL" >> $GITHUB_ENV
        
    - name: Comment download link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚀 **Build completed!** Download the JAR file directly: ${{ env.DOWNLOAD_URL }}'
          })