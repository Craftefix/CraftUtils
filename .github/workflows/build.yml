name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build shadow JAR
      run: ./gradlew shadowJar
      
    - name: Generate build tag
      id: build_tag
      run: |
        BUILD_TAG="build-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}"
        echo "tag=$BUILD_TAG" >> $GITHUB_OUTPUT
        
    - name: Create build release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.build_tag.outputs.tag }}
        name: "Build ${{ steps.build_tag.outputs.tag }}"
        body: |
          Automated build from commit ${{ github.sha }}
          
          **Download the JAR file directly from the assets below.**
        files: build/libs/CraftUtils-1.0.0-all.jar
        prerelease: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}