name: Build CraftUtils

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  # Only run on commits with BUILDME in the message
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build'
        required: false
        default: 'false'

jobs:
  check-commit:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if should build
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            # Check commit message for BUILDME
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if [[ "$COMMIT_MSG" == *"BUILDME"* ]]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "✅ Found BUILDME in commit message: $COMMIT_MSG"
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "❌ No BUILDME found in commit message: $COMMIT_MSG"
            fi
          fi

  build:
    needs: check-commit
    if: needs.check-commit.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
      
      - name: Set version to beta 0.1.0
        run: |
          echo "📝 Setting version to beta 0.1.0"
          sed -i "s/version = '.*'/version = '0.1.0-beta'/" build.gradle
          echo "Current version in build.gradle:"
          grep "version = " build.gradle
      
      - name: Build Plugin
        run: |
          echo "🔨 Building CraftUtils plugin..."
          ./gradlew clean build shadowJar --info --stacktrace
      
      - name: Run Basic Tests
        run: |
          echo "🧪 Running basic compilation tests..."
          ./gradlew test --info --stacktrace || echo "⚠️ Tests failed but continuing with build"
      
      - name: Get artifact name
        id: artifact
        run: |
          VERSION="0.1.0-beta"
          ARTIFACT_NAME="CraftUtils-${VERSION}.jar"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            build/libs/CraftUtils-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          retention-days: 30
      
      - name: Upload Shadow JAR
        uses: actions/upload-artifact@v4
        with:
          name: CraftUtils-${{ steps.artifact.outputs.version }}-shadow
          path: build/libs/*-all.jar
          retention-days: 30
      
      - name: Build Summary
        run: |
          echo "## 🎉 Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.artifact.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Built at:** \`$(date -u)\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.artifact.outputs.artifact_name }}\` - Main plugin JAR" >> $GITHUB_STEP_SUMMARY
          echo "- \`CraftUtils-${{ steps.artifact.outputs.version }}-shadow.jar\` - Shaded JAR with dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Information:" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** 21 (Temurin)" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Version:** $(./gradlew --version | grep Gradle | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Minecraft:** 1.21.8+" >> $GITHUB_STEP_SUMMARY
          echo "- **Server Software:** Paper/Spigot" >> $GITHUB_STEP_SUMMARY
          
          # List actual files created
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Files:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la build/libs/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎉 Build Successful!
              
              **Version:** \`${{ steps.artifact.outputs.version }}\`
              **Commit:** \`${{ github.sha }}\`
              
              ### 📦 Artifacts Available:
              - \`${{ steps.artifact.outputs.artifact_name }}\`
              - \`CraftUtils-${{ steps.artifact.outputs.version }}-shadow.jar\`
              
              The plugin has been built successfully and is ready for testing!`
            });

  skip-build:
    needs: check-commit
    if: needs.check-commit.outputs.should_build == 'false'
    runs-on: ubuntu-22.04
    steps:
      - name: Skip Build
        run: |
          echo "⏭️ Skipping build - no BUILDME found in commit message"
          echo "To run build, include 'BUILDME' in your commit message"
