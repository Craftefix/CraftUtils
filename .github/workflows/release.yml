name: Release

on:
  push:
    branches:
      - main
      - master
      - gh-pages
    paths:
      - 'build.gradle'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build shadow JAR
      run: ./gradlew clean shadowJar
      
    - name: Extract version from build.gradle
      id: version
      run: |
        VERSION=$(grep "version = " build.gradle | sed "s/version = '\(.*\)'/\1/" | tr -d "'\"")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
        
    - name: Check if version changed
      id: version_check
      run: |
        # Check if this version tag already exists
        if git tag -l "v${{ steps.version.outputs.version }}" | grep -q "v${{ steps.version.outputs.version }}"; then
          echo "Version v${{ steps.version.outputs.version }} already exists as a tag. Skipping release."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "New version detected: v${{ steps.version.outputs.version }}"
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
        
        # Determine if prerelease
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "is_prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Generate release notes
      if: steps.version_check.outputs.skip == 'false'
      id: release_notes
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        VERSION="${{ steps.version.outputs.version }}"
        
        # Get the previous tag for changelog
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        # Generate release notes
        cat > release_notes.md << EOF
        ## CraftUtils $TAG
        
        **Release Date:** $(date -u '+%Y-%m-%d')
        **Version:** $VERSION
        
        ### Changes
        EOF
        
        if [ -n "$PREV_TAG" ]; then
          echo "" >> release_notes.md
          echo "**Commits since $PREV_TAG:**" >> release_notes.md
          git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> release_notes.md
        else
          echo "- Initial release of CraftUtils with comprehensive plugin management features" >> release_notes.md
        fi
        
        cat >> release_notes.md << EOF
        
        ### Installation
        
        1. Download \`CraftUtils-$VERSION-all.jar\` from the assets below
        2. Place it in your server's \`plugins/\` folder
        3. Restart your server
        4. Configure permissions and features in \`plugins/CraftUtils/config.yml\`
        
        ### Documentation
        
        - [Getting Started Guide](https://craftefix.github.io/CraftUtils/docs/getting-started)
        - [Commands Reference](https://craftefix.github.io/CraftUtils/docs/commands)
        
        ### Support
        
        - [Report Issues](https://github.com/Craftefix/CraftUtils/issues)
        EOF
        
    - name: Create Git tag
      if: steps.version_check.outputs.skip == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.version.outputs.tag }}" -m "Release version ${{ steps.version.outputs.version }}"
        git push origin "${{ steps.version.outputs.tag }}"
        
    - name: Create release
      if: steps.version_check.outputs.skip == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "CraftUtils ${{ steps.version.outputs.tag }}"
        body_path: release_notes.md
        files: build/libs/*.jar
        prerelease: ${{ steps.version_check.outputs.is_prerelease }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Skip message
      if: steps.version_check.outputs.skip == 'true'
      run: |
        echo "⚠️ Version ${{ steps.version.outputs.version }} already exists. Skipping release creation."