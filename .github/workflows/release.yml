name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
      - alpha-releases

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version bumping
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Get current version
      id: current_version
      run: |
        CURRENT_VERSION=$(grep "version = " build.gradle | sed "s/version = '\(.*\)'/\1/" | tr -d "'\"")
        echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
        
    - name: Determine version bump type
      id: bump_type
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"
        PR_BODY="${{ github.event.pull_request.body }}"
        
        # Check for version bump indicators in PR title/body
        if echo "$PR_TITLE $PR_BODY" | grep -i -E "breaking|major|BREAKING CHANGE"; then
          echo "type=major" >> $GITHUB_OUTPUT
        elif echo "$PR_TITLE $PR_BODY" | grep -i -E "feat|feature|minor"; then
          echo "type=minor" >> $GITHUB_OUTPUT
        else
          echo "type=patch" >> $GITHUB_OUTPUT
        fi
        
    - name: Bump version
      id: new_version
      run: |
        CURRENT="${{ steps.current_version.outputs.current }}"
        BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
        
        # Parse current version (assuming semver: x.y.z)
        IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}
        
        # Bump version based on type
        case $BUMP_TYPE in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Bumped version: $CURRENT -> $NEW_VERSION ($BUMP_TYPE)"
        
    - name: Update build.gradle version
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.version }}"
        sed -i "s/version = '[^']*'/version = '$NEW_VERSION'/" build.gradle
        echo "Updated build.gradle to version $NEW_VERSION"
        
    - name: Update config.yml versions
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.version }}"
        sed -i "s/config: \"[^\"]*\"/config: \"$NEW_VERSION\"/" src/main/resources/config.yml
        sed -i "s/database: \"[^\"]*\"/database: \"$NEW_VERSION\"/" src/main/resources/config.yml
        sed -i "s/plugin: \"[^\"]*\"/plugin: \"$NEW_VERSION\"/" src/main/resources/config.yml
        echo "Updated config.yml versions to $NEW_VERSION"
        
    - name: Build shadow JAR
      run: ./gradlew clean shadowJar
      
    - name: Commit version bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add build.gradle src/main/resources/config.yml
        git commit -m "Bump version to ${{ steps.new_version.outputs.version }}"
        git push origin ${{ github.event.pull_request.base.ref }}
        
    - name: Create Git tag
      run: |
        git tag -a "${{ steps.new_version.outputs.tag }}" -m "Release version ${{ steps.new_version.outputs.version }}"
        git push origin "${{ steps.new_version.outputs.tag }}"
        
    - name: Generate release notes
      id: release_notes
      run: |
        TAG="${{ steps.new_version.outputs.tag }}"
        VERSION="${{ steps.new_version.outputs.version }}"
        PR_NUMBER="${{ github.event.pull_request.number }}"
        PR_TITLE="${{ github.event.pull_request.title }}"
        PR_AUTHOR="${{ github.event.pull_request.user.login }}"
        
        # Get the previous tag for changelog
        PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
        
        # Generate release notes
        cat > release_notes.md << EOF
        ## CraftUtils $TAG
        
        **Release Date:** $(date -u '+%Y-%m-%d')
        **Version:** $VERSION
        **Released from PR:** #$PR_NUMBER - $PR_TITLE by @$PR_AUTHOR
        
        ### Changes
        EOF
        
        if [ -n "$PREV_TAG" ]; then
          echo "" >> release_notes.md
          echo "**Changes since $PREV_TAG:**" >> release_notes.md
          git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG^" >> release_notes.md
          echo "" >> release_notes.md
          echo "- $PR_TITLE (#$PR_NUMBER)" >> release_notes.md
        else
          echo "- $PR_TITLE (#$PR_NUMBER)" >> release_notes.md
        fi
        
        cat >> release_notes.md << EOF
        
        ### Installation
        
        1. Download \`CraftUtils-$VERSION-all.jar\` from the assets below
        2. Place it in your server's \`plugins/\` folder
        3. Restart your server
        4. Configure permissions and features in \`plugins/CraftUtils/config.yml\`
        
        ### Documentation
        
        - [Getting Started Guide](https://craftefix.github.io/CraftUtils/docs/getting-started)
        - [Commands Reference](https://craftefix.github.io/CraftUtils/docs/commands)
        
        ### Support
        
        - [Report Issues](https://github.com/Craftefix/CraftUtils/issues)
        EOF
        
    - name: Create draft release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.new_version.outputs.tag }}
        name: "CraftUtils ${{ steps.new_version.outputs.tag }}"
        body_path: release_notes.md
        files: build/libs/*.jar
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}