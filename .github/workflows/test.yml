name: Test with MariaDB and MySQL

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  # Only run on commits with TESTME in the message
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run tests'
        required: false
        default: 'false'

jobs:
  check-commit:
    runs-on: ubuntu-22.04
    outputs:
      should_test: ${{ steps.check.outputs.should_test }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if should run tests
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_test=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_test=true" >> $GITHUB_OUTPUT
          else
            # Check commit message for TESTME
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if [[ "$COMMIT_MSG" == *"TESTME"* ]]; then
              echo "should_test=true" >> $GITHUB_OUTPUT
              echo "✅ Found TESTME in commit message: $COMMIT_MSG"
            else
              echo "should_test=false" >> $GITHUB_OUTPUT
              echo "❌ No TESTME found in commit message: $COMMIT_MSG"
            fi
          fi

  test:
    needs: check-commit
    if: needs.check-commit.outputs.should_test == 'true'
    runs-on: ubuntu-22.04
    
    strategy:
      matrix:
        database:
          - name: "MariaDB 11.4"
            image: "mariadb:11.4"
            port: 3306
          - name: "MySQL 8.4"
            image: "mysql:8.4"
            port: 3307
    
    services:
      database:
        image: ${{ matrix.database.image }}
        ports:
          - ${{ matrix.database.port }}:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: craftutils_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
      
      - name: Wait for Database
        run: |
          echo "Waiting for ${{ matrix.database.name }} to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P ${{ matrix.database.port }} -u root -prootpassword --silent; then
              echo "${{ matrix.database.name }} is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 3
          done
      
      - name: Run Tests
        env:
          DB_NAME: ${{ matrix.database.name }}
          DB_PORT: ${{ matrix.database.port }}
        run: |
          echo "🧪 Running tests against ${{ matrix.database.name }}"
          ./gradlew test --info --stacktrace
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.database.name }}-${{ github.run_number }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
      
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ matrix.database.name }})
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

  test-summary:
    needs: [check-commit, test]
    if: always() && needs.check-commit.outputs.should_test == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Test Summary
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ All tests passed successfully!"
            echo "- MariaDB 11.4: ✅"
            echo "- MySQL 8.4: ✅"
          else
            echo "❌ Some tests failed!"
            echo "Check the test results artifacts for details."
            exit 1
          fi
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ needs.test.result }}';
            const emoji = testResult === 'success' ? '✅' : '❌';
            const status = testResult === 'success' ? 'passed' : 'failed';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Test Results
              
              Database tests have **${status}**!
              
              - MariaDB 11.4: ${emoji}
              - MySQL 8.4: ${emoji}
              
              ${testResult === 'success' ? 'All database integration tests are working correctly.' : 'Please check the test results for more details.'}`
            });

  skip-tests:
    needs: check-commit
    if: needs.check-commit.outputs.should_test == 'false'
    runs-on: ubuntu-22.04
    steps:
      - name: Skip Tests
        run: |
          echo "⏭️ Skipping tests - no TESTME found in commit message"
          echo "To run tests, include 'TESTME' in your commit message"