version: '3.8'

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: craftutils-test
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.8" 
      MEMORY: "2G"
      DIFFICULTY: "easy"
      ONLINE_MODE: "false"
      OPS: "testuser"
      WHITELIST: "testuser"
    volumes:
      - ./build/libs/CraftUtils-0.0.b55-all.jar:/data/plugins/CraftUtils.jar:ro
      - ./test-server-data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true